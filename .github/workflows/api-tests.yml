name: API tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "package.json"
  pull_request:
    paths:
      - "server/**"
      - "package.json"
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        run: npm run server:install

      - name: Run API tests
        run: npm run test:api
