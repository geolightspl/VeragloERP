# Deploy Veraglo ERP to the production Ubuntu server (Node.js full ERP by default).
name: Deploy — production server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: false
        default: "main"
      runtime:
        description: "Runtime: node (full ERP APIs) or java (Phase 2 APIs only)"
        required: false
        default: "node"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST || '13.203.208.226' }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e
            REMOTE_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/VeragloERP' }}"
            BRANCH="${{ github.event.inputs.branch || 'main' }}"
            PORT="${{ secrets.DEPLOY_APP_PORT || '3000' }}"
            RUNTIME="${{ github.event.inputs.runtime || 'node' }}"
            JAR_NAME="veraglo-erp-2.0.0-SNAPSHOT.jar"
            cd "${REMOTE_DIR}"
            echo "==> storage mode"
            if [ -f server/.env ]; then
              if command -v docker >/dev/null 2>&1 && docker compose ps postgres 2>/dev/null | grep -qi running; then
                echo "Postgres container running — using DATABASE_URL"
              else
                echo "No Postgres container — USE_FILE_STORAGE=1"
                touch server/.env
                if grep -q '^USE_FILE_STORAGE=' server/.env; then
                  sed -i 's/^USE_FILE_STORAGE=.*/USE_FILE_STORAGE=1/' server/.env
                else
                  echo "USE_FILE_STORAGE=1" >> server/.env
                fi
              fi
              APP_PORT="$(grep -E '^PORT=' server/.env 2>/dev/null | tail -1 | cut -d= -f2 | tr -d ' \"' || true)"
              if [ -n "${APP_PORT}" ]; then PORT="${APP_PORT}"; fi
            fi
            echo "==> ensure git remote points at canonical repo"
            CANONICAL_ORIGIN="https://github.com/geolightspl/VeragloERP.git"
            CURRENT_ORIGIN="$(git remote get-url origin 2>/dev/null || true)"
            if [ "${CURRENT_ORIGIN}" != "${CANONICAL_ORIGIN}" ]; then
              echo "==> updating origin from ${CURRENT_ORIGIN} to ${CANONICAL_ORIGIN}"
              git remote set-url origin "${CANONICAL_ORIGIN}"
            fi
            echo "==> stop running app (release file locks before git clean)"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop veraglo-erp 2>/dev/null || true
              pm2 stop veraglo-erp-java 2>/dev/null || true
            else
              pkill -f "${REMOTE_DIR}/server/index.js" 2>/dev/null || true
              pkill -f "${JAR_NAME}" 2>/dev/null || true
            fi
            sleep 2
            echo "==> git fetch && checkout ${BRANCH}"
            git remote -v
            git fetch origin --prune --force "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            REMOTE_SHA="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
            echo "==> origin/${BRANCH} at ${REMOTE_SHA}"
            git checkout "${BRANCH}" 2>/dev/null || git checkout -b "${BRANCH}" "origin/${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            git log -1 --oneline
            # Never delete live data or env files during deploy
            git clean -fd -e server/.env -e .env -e data -e 'data/*' 2>/dev/null || true
            if command -v docker >/dev/null 2>&1 && [ -f docker-compose.yml ]; then
              echo "==> docker compose up -d (postgres)"
              docker compose up -d || true
            fi
            if [ "${RUNTIME}" = "java" ] && [ -d java-backend ]; then
              echo "==> build Java backend"
              if ! command -v mvn >/dev/null 2>&1; then
                for i in 1 2 3 4 5; do
                  sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq maven openjdk-21-jre-headless && break
                  echo "apt lock — retry $i/5"
                  sleep 15
                done
              fi
              export DATABASE_URL="jdbc:postgresql://localhost:5432/veraglo_erp"
              export DB_USER="veraglo"
              export DB_PASSWORD="veraglo"
              export PORT="${PORT}"
              export VERAGLO_FRONTEND_PATH="${REMOTE_DIR}"
              (cd java-backend && mvn -q -DskipTests package)
              JAR_PATH="${REMOTE_DIR}/java-backend/target/${JAR_NAME}"
              if command -v pm2 >/dev/null 2>&1; then
                pm2 delete veraglo-erp-java 2>/dev/null || true
                pm2 delete veraglo-erp 2>/dev/null || true
                pm2 start "java -jar ${JAR_PATH}" --name veraglo-erp-java --cwd "${REMOTE_DIR}"
                pm2 save || true
              else
                nohup java -jar "${JAR_PATH}" > /tmp/veraglo-java-api.log 2>&1 &
                sleep 4
              fi
            else
              echo "==> npm install (Node server)"
              (cd server && rm -rf node_modules && npm install)
              echo "==> restart Node API via ecosystem.config.cjs (fork mode)"
              if command -v pm2 >/dev/null 2>&1; then
                pm2 delete veraglo-erp 2>/dev/null || true
                (cd server && pm2 start ecosystem.config.cjs)
                pm2 save || true
                sleep 2
                pm2 status veraglo-erp || true
              else
                (cd server && nohup npm start > /tmp/veraglo-api.log 2>&1 &)
                sleep 3
              fi
            fi
            echo "==> health check"
            if ! curl -sf "http://127.0.0.1:${PORT}/api/health" -o /tmp/veraglo-health.json; then
              echo "health check failed — recent pm2 logs:"
              pm2 logs veraglo-erp --nostream --lines 40 2>/dev/null || true
              exit 1
            fi
            head -c 240 /tmp/veraglo-health.json; echo ""
            echo "==> listen sockets"
            ss -tlnp | grep ":${PORT}" || true
            if command -v ufw >/dev/null 2>&1 && sudo ufw status 2>/dev/null | grep -qi "Status: active"; then
              echo "==> ufw active — ensuring port ${PORT} is allowed"
              sudo ufw allow "${PORT}/tcp" || true
            fi
            TOKEN="$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null || true)"
            if [ -n "${TOKEN}" ]; then
              PUBLIC_IP="$(curl -sf -H "X-aws-ec2-metadata-token: ${TOKEN}" http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || true)"
            else
              PUBLIC_IP="$(curl -sf --max-time 5 http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || true)"
            fi
            if [ -n "${PUBLIC_IP}" ]; then
              echo "==> public health (${PUBLIC_IP}:${PORT})"
              if ! curl -sf --max-time 5 "http://${PUBLIC_IP}:${PORT}/api/health" | head -c 120; then
                echo "WARN: public IP health failed from server (hairpin)"
                echo "  - AWS EC2 security group must allow inbound TCP ${PORT} from 0.0.0.0/0"
                echo "  - If ufw is active, port ${PORT} must be allowed (deploy attempts this automatically)"
              fi
            fi
            echo "==> nginx reverse proxy (port 80)"
            if command -v apt-get >/dev/null 2>&1; then
              if ! command -v nginx >/dev/null 2>&1; then
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx || true
              fi
              if command -v nginx >/dev/null 2>&1; then
                sudo sed "s/127.0.0.1:3000/127.0.0.1:${PORT}/" "${REMOTE_DIR}/scripts/deploy/nginx-veraglo.conf" | sudo tee /etc/nginx/sites-available/veraglo-erp >/dev/null
                sudo ln -sf /etc/nginx/sites-available/veraglo-erp /etc/nginx/sites-enabled/veraglo-erp
                sudo rm -f /etc/nginx/sites-enabled/default
                sudo nginx -t && sudo systemctl enable nginx && sudo systemctl reload nginx
              fi
            fi
            echo "==> restart app after nginx (ensure backend is up)"
            if command -v pm2 >/dev/null 2>&1; then
              (cd server && pm2 restart ecosystem.config.cjs 2>/dev/null || pm2 start ecosystem.config.cjs)
              pm2 save || true
              sleep 3
              pm2 status veraglo-erp || true
            fi
            echo "==> post-nginx health"
            if ! curl -sf "http://127.0.0.1:${PORT}/api/health" -o /tmp/veraglo-health2.json; then
              pm2 logs veraglo-erp --nostream --lines 40
              exit 1
            fi
            head -c 120 /tmp/veraglo-health2.json; echo ""
            if command -v nginx >/dev/null 2>&1; then
              if ! curl -sf "http://127.0.0.1/api/health" -o /tmp/veraglo-nginx-health.json; then
                echo "nginx proxy health failed"
                sudo tail -20 /var/log/nginx/error.log 2>/dev/null || true
                pm2 logs veraglo-erp --nostream --lines 40
                exit 1
              fi
              head -c 120 /tmp/veraglo-nginx-health.json; echo ""
            fi
            ss -tlnp | grep ":${PORT}" || { echo "FATAL: nothing listening on port ${PORT}"; pm2 logs veraglo-erp --nostream --lines 40; exit 1; }
            echo "==> host firewall (iptables allow web)"
            sudo iptables -I INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || true
            sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || true
            sudo iptables -I INPUT -p tcp --dport "${PORT}" -j ACCEPT 2>/dev/null || true
            echo "==> all listeners"
            ss -tlnp || true
            echo ""
            echo "==> UI build tag"
            grep -o 'VG_BUILD = "[^"]*"' index.html 2>/dev/null || true
            echo ""
            echo "Deploy complete (${RUNTIME})."

      - name: External health check
        run: |
          HOST="${{ secrets.DEPLOY_HOST || '13.203.208.226' }}"
          PORT="${{ secrets.DEPLOY_APP_PORT || '3000' }}"
          ok=0
          for url in "http://${HOST}:${PORT}/api/health" "http://${HOST}/api/health"; do
            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 8 "$url" | grep -q '"ok":true'; then
                echo "External health OK: $url"
                ok=1
                break 2
              fi
              echo "Waiting for $url ($i/5)…"
              sleep 4
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::App runs on the server but is NOT reachable from the internet."
            echo "::warning::In AWS Console → EC2 → Security Groups → Inbound rules, add:"
            echo "::warning::  Custom TCP 3000 from 0.0.0.0/0"
            echo "::warning::  HTTP 80 from 0.0.0.0/0"
          fi
