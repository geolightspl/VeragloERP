# Deploy Veraglo ERP to the production Ubuntu server (Java Spring Boot by default).
name: Deploy — production server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: false
        default: "main"
      runtime:
        description: "Runtime: java or node"
        required: false
        default: "java"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST || '13.203.208.226' }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            REMOTE_DIR="${{ secrets.DEPLOY_DIR || '/home/ubuntu/VeragloERP' }}"
            BRANCH="${{ github.event.inputs.branch || 'main' }}"
            PORT="${{ secrets.DEPLOY_APP_PORT || '3000' }}"
            RUNTIME="${{ github.event.inputs.runtime || 'java' }}"
            JAR_NAME="veraglo-erp-2.0.0-SNAPSHOT.jar"
            cd ${REMOTE_DIR}
            echo "==> git fetch && checkout ${BRANCH}"
            git remote -v
            git fetch origin --prune --force "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            REMOTE_SHA="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
            echo "==> origin/${BRANCH} at ${REMOTE_SHA}"
            git checkout "${BRANCH}" 2>/dev/null || git checkout -b "${BRANCH}" "origin/${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            git log -1 --oneline
            test -f index.html || { echo "FATAL: missing index.html in ${REMOTE_DIR}"; ls -la; exit 1; }
            test -f server/index.js || { echo "FATAL: missing server/index.js"; exit 1; }
            # Never delete live data or env files during deploy
            git clean -fd -e server/.env -e .env -e data -e 'data/*' -e 'data/**' 2>/dev/null || true
            # Verify data directory is intact
            DATA_DIR="${REMOTE_DIR}/data"
            if [ -n "${VERAGLO_DATA_DIR:-}" ]; then DATA_DIR="${VERAGLO_DATA_DIR}"; fi
            echo "==> data directory: ${DATA_DIR}"
            ls -la "${DATA_DIR}" 2>/dev/null || echo "(data dir empty or missing — first deploy)"
            if [ -d "${DATA_DIR}/tenants/default" ]; then
              echo "==> default tenant data exists:"
              ls -la "${DATA_DIR}/tenants/default/" 2>/dev/null
              wc -c "${DATA_DIR}/tenants/default/erp_state.json" 2>/dev/null || true
            fi
            # Ensure VERAGLO_DATA_DIR is set in server/.env if not already
            if ! grep -q '^VERAGLO_DATA_DIR=' server/.env 2>/dev/null; then
              echo "VERAGLO_DATA_DIR=${DATA_DIR}" >> server/.env
              echo "==> added VERAGLO_DATA_DIR=${DATA_DIR} to server/.env"
            fi
            if command -v docker >/dev/null 2>&1 && [ -f docker-compose.yml ]; then
              echo "==> docker compose up -d (postgres)"
              docker compose up -d || true
            fi
            if [ "${RUNTIME}" = "java" ] && [ -d java-backend ]; then
              echo "==> build Java backend"
              if ! command -v mvn >/dev/null 2>&1; then
                sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq maven openjdk-21-jre-headless
              fi
              export DATABASE_URL="jdbc:postgresql://localhost:5432/veraglo_erp"
              export DB_USER="veraglo"
              export DB_PASSWORD="veraglo"
              export PORT="${PORT}"
              export VERAGLO_FRONTEND_PATH="${REMOTE_DIR}"
              (cd java-backend && mvn -q -DskipTests package)
              JAR_PATH="${REMOTE_DIR}/java-backend/target/${JAR_NAME}"
              if command -v pm2 >/dev/null 2>&1; then
                pm2 delete veraglo-erp-java 2>/dev/null || true
                pm2 delete veraglo-erp 2>/dev/null || true
                pm2 start "java -jar ${JAR_PATH}" --name veraglo-erp-java --cwd ${REMOTE_DIR}
                pm2 save || true
              else
                pkill -f "${JAR_NAME}" 2>/dev/null || true
                nohup java -jar "${JAR_PATH}" > /tmp/veraglo-java-api.log 2>&1 &
                sleep 4
              fi
            else
              echo "==> npm install (legacy Node server)"
              cd server && npm install && cd ..
              if command -v pm2 >/dev/null 2>&1; then
                pm2 restart veraglo-erp 2>/dev/null || pm2 start server/index.js --name veraglo-erp --cwd ${REMOTE_DIR}/server
                pm2 save || true
              else
                pkill -f "node index.js" 2>/dev/null || true
                cd server && nohup npm start > /tmp/veraglo-api.log 2>&1 &
                sleep 2
              fi
            fi
            echo "==> health check"
            curl -sf "http://127.0.0.1:${PORT}/api/health" | head -c 240
            echo ""
            echo "Deploy complete (${RUNTIME})."
